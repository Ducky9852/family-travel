<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>우리 가족 여행 플래너 & 가계부</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.svg" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <!-- 1. 가족 PIN 잠금 화면 -->
  <section id="pin-screen" class="pin-screen">
    <div class="pin-card">
      <div class="pin-logo">✈️</div>
      <h1>우리 가족 여행 플래너</h1>
      <p id="pin-mode-desc">가족 PIN을 입력해 여행 일정과 가계부를 열어주세요.</p>
      <form id="pin-form">
        <div class="pin-input-row">
          <input
            id="pin-input"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            placeholder="PIN 입력"
            maxlength="12"
            required
          />
        </div>
        <div id="pin-error" class="pin-error"></div>
        <button type="submit" class="btn btn-primary btn-block" id="pin-submit-btn">입장하기</button>
      </form>
      <div class="pin-hint">
        초기 기본 PIN: <strong>2027</strong> (입장 후 설정에서 변경 가능)<br />
        <button type="button" id="pin-open-settings" style="margin-top:8px;color:var(--accent);font-weight:700;text-decoration:underline;">
          ⚙️ Supabase / 지도 키 먼저 설정하기
        </button>
      </div>
    </div>
  </section>

  <!-- 2. 메인 앱 셸 -->
  <div id="app-shell" class="app-shell hidden">
    <header class="top-header">
      <div class="header-row">
        <button type="button" id="btn-back-hub" class="icon-btn hidden" aria-label="여행 목록">←</button>
        <div class="header-title-wrap">
          <h1 id="header-title" class="header-title">우리 가족 여행 보관함</h1>
          <div id="header-sub" class="header-sub">
            <span id="sync-badge" class="sync-pill">로컬 모드</span>
            <span id="header-meta"></span>
          </div>
        </div>
        <button type="button" id="btn-fx-calc" class="icon-btn hidden" aria-label="환율 계산기" title="환율 계산기">💱</button>
        <button type="button" id="btn-refresh" class="icon-btn" aria-label="새로고침" title="동기화">🔄</button>
        <button type="button" id="btn-settings" class="icon-btn" aria-label="설정" title="설정">⚙️</button>
      </div>
    </header>

    <main id="main-content" class="main-content"></main>

    <!-- 하단 4탭 + 중앙 영수증 촬영 FAB -->
    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="하단 메뉴">
      <button type="button" class="nav-tab active" data-tab="itinerary">
        <span class="nav-icon">🗓️</span>
        <span>일정</span>
      </button>
      <button type="button" class="nav-tab" data-tab="map">
        <span class="nav-icon">🗺️</span>
        <span>지도·후보</span>
      </button>
      <div class="nav-fab-wrap">
        <button type="button" id="btn-quick-receipt" class="nav-fab" aria-label="영수증 촬영" title="영수증 사진으로 가계부 자동 등록">📷</button>
      </div>
      <button type="button" class="nav-tab" data-tab="budget">
        <span class="nav-icon">💰</span>
        <span>가계부</span>
      </button>
      <button type="button" class="nav-tab" data-tab="prep">
        <span class="nav-icon">✅</span>
        <span>준비·정보</span>
      </button>
    </nav>
  </div>

  <!-- 숨겨진 파일 입력 (카메라/갤러리 영수증, 바우처 첨부) -->
  <input id="receipt-file-input" type="file" accept="image/*" capture="environment" class="hidden" />
  <input id="receipt-gallery-input" type="file" accept="image/*" class="hidden" />
  <input id="voucher-file-input" type="file" accept="image/*,application/pdf" class="hidden" />

  <!-- 공용 네이티브 모달 다이얼로그 -->
  <dialog id="app-dialog" closedby="any" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <h1 id="dialog-title">상세</h1>
      <button type="button" class="dialog-close" id="dialog-close-btn" aria-label="닫기">✕</button>
    </div>
    <div id="dialog-body" class="dialog-body"></div>
    <div id="dialog-footer" class="dialog-footer"></div>
  </dialog>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script>
    if (location.protocol === "file:") {
      var errEl = document.getElementById("pin-error");
      if (errEl) {
        errEl.style.color = "#b45309";
        errEl.innerHTML = "⚠️ HTML 파일을 직접 열면 브라우저 보안 정책으로 실행되지 않습니다.<br/>폴더의 <b>미리보기_실행.bat</b>을 실행하거나 <b>http://127.0.0.1:8765</b>로 열어주세요.";
      }
    }
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
